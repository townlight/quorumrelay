	$(document).ready(function ()
    {
		$("#DateRangeOptionID").change(function (e)

			showCustomDateRangePicker();
		});

		datePickerController.createDatePicker(
		{
			// Associate the text input to a Local date format
			formElements: { "DateRangeCustomStartDate": "%n/%j/%Y" }
		});
		datePickerController.createDatePicker(
		{
			// Associate the text input to a Local date format
			formElements: { "DateRangeCustomEndDate": "%n/%j/%Y" }
		});

        showCustomDateRangePicker();
		showMeetingTypeButtonText();

		$("#btnSearch").click(function (e) {
			btnSearchClick();
			return false;
		});
	})

	function btnSearchClick() {
		$("#btnSearch").prop("disabled", true);
		$("#btnSearch").val("Searching...");

		// Navigate to run search
		window.location = getUrlForSearch();
	}

	function getUrlForSearch() {
		let dateRangeOption = $("#DateRangeOptionID").val();
		let meetingTypeIds = $("#MeetingTypeIDs").val();
		let searchText = $("#Keywords").val();

		let url = "/OnBaseAgendaOnline/Meetings/Search?dropid=" + encodeURIComponent(dateRangeOption);
		if (meetingTypeIds.length > 0) {
			url += "&mtids=" + encodeURIComponent(meetingTypeIds);
		}
		//if (searchText.length > 0) {
			//url += "&searchTerm=" + encodeURIComponent(searchText);
		//}
		if (dateRangeOption == 11) {
			if ($("#DateRangeCustomStartDate").val().length > 0)
			{
				url += "&dropsv=" + encodeURIComponent($("#DateRangeCustomStartDate").val());
			}
			if ($("#DateRangeCustomEndDate").val().length > 0) {
				url += "&dropev=" + encodeURIComponent($("#DateRangeCustomEndDate").val());
			}
		}

		return url;
	}

	function showCustomDateRangePicker()
	{
		if ($("#DateRangeOptionID").val() == 11)
		{
			$("#divDatePicker").show();
			showDatePickerHoverText();
		}
		else
		{
			$("#divDatePicker").hide();
		}
	}

	function showDatePickerHoverText()
	{
		$("#fd-but-DateRangeCustomStartDate").attr("title", "Show Calendar for Starting Date");
		$("#fd-but-DateRangeCustomStartDate span + span").remove();
		$("#fd-but-DateRangeCustomEndDate").attr("title", "Show Calendar for Ending Date");
		$("#fd-but-DateRangeCustomEndDate span + span").remove();
	}

	function showMeetingTypeButtonText() {
		var meetingTypeInput = $('#lblMeetingTypeIDs');
		$("#divMainMeetingTypeIDs").find('input').change(function (e) {
			var selectedValues = $("#MeetingTypeIDs").val();
			var selectedValuesCount = selectedValues.split(',').length;

			if ((selectedValues.length > 0) && (selectedValuesCount > 0) && (selectedValuesCount < 3)) {
				meetingTypeInput.text(format("Selected Meeting Types: {0}", meetingTypeInput.text()));
			}
		});
	}
</script>

	function showSearchResults(searchResults) {
		try {
			loadSearchResults(searchResults);

			// Clear out results
			let meetingListDiv = $("#meetings-list");
			meetingListDiv.empty();

			if (_searchResults.Meetings.length == 0) {
				// No meetings returned
				meetingListDiv.append(createMeetingTable(meetingListDiv, []));
			}
			else if (_runningFullTextSearch) {
				// For full-text searches don't show tabs
				showErrorMessages(searchResults);
				setupGetMoreResults(searchResults);

				meetingListDiv.append(createMeetingTable(meetingListDiv, _searchResults.Meetings));
			}
			else if (!Options.isTabbed && !Options.isUpcomingSeparate) {
				meetingListDiv.append(createMeetingTable(meetingListDiv, _searchResults.Meetings));
			}
			else {
				createMeetingTabs(meetingListDiv);
			}

			initializeMeetingSorting();
		}
		catch (ex) {
			console.error("Error occurred while loading the search results: " + ex.toString());
			$("#getMoreResultsError").removeClass("hidden").text("Error occurred running search, please try again or try again later.");
		}
	}

	function setupGetMoreResults(searchResults) {
		if (searchResults.Meetings.length == 0 || searchResults.NoMoreResults) {
			$("#btnGetMoreResults").val(Translations.NO_MORE_RESULTS_TEXT);
			$("#btnGetMoreResults").prop("disabled", true);
		}
		else {
			$("#lastMeetingIdSearched").val(searchResults.Meetings[searchResults.Meetings.length - 1].ID);
			$("#btnGetMoreResults").removeClass("hidden").val(Translations.GET_MORE_RESULTS_TEXT).prop("disabled", false);
		}
	}

	function showErrorMessages(searchResults) {
		if (searchResults.ErrorOccurred) {
			$("#getMoreResultsError").removeClass("hidden").text(searchResults.getErrorMessage());
		} else {
			$("#getMoreResultsError").addClass("hidden")
		}
		if (searchResults.WarningOccurred) {
			$("#getMoreResultsWarning").removeClass("hidden").text(searchResults.getWarningMEssage());
		} else {
			$("#getMoreResultsWarning").addClass("hidden")
		}
	}

	function loadSearchResults(searchResults) {
		if (_searchResults == null) {
			_searchResults = searchResults;
		}
		else {
			searchResults.Meetings.forEach(meeting => {
				let currentMeeting = _searchResults.Meetings.find((m) => m.ID == meeting.ID);
				if (currentMeeting) {
					// Merge new found documents
					meeting.Documents.forEach(document => {
						currentMeeting.Documents.push(document);
					});
				}
				else {
					// New meeting was returned
					_searchResults.Meetings.push(meeting);
				}
			});
		}
	}

	class SearchResults {
		constructor(data) {
			this.Meetings = [];
			this.DocIdsRemaining = data.DocIdsRemaining;
			this.ErrorOccurred = data.ErrorOccurred;
			this.ErrorCode = data.ErrorCode;
			this.WarningOccurred = data.WarningOccurred;
			this.WarningCode = data.WarningCode;
			this.NoMoreResults = data.NoMoreResults;

			if (Array.isArray(data.Meetings)) {
				data.Meetings.forEach(meeting => {
					this.Meetings.push(new Meeting(meeting));
				});
			}
		}

		getUpcomingMeetings() {
			// Any meeting on a future date
			let today = new Date(Date.parse(new Date(Date.now()).toLocaleDateString()));
			return this.Meetings.filter((m) => m.TimeStamp.getTime() > today.getTime())
				.sort((a, b) => a.TimeStamp.getTime() - b.TimeStamp.getTime()); // Sort ascending
		}

		getPastMeetings() {
			// Any meeting, even for today, which start time has passed
			let now = new Date(Date.now());
			return this.Meetings.filter((m) => m.TimeStamp.getTime() <= now.getTime())
				.sort((a, b) => b.TimeStamp.getTime() - a.TimeStamp.getTime()); // Sort descending
		}

		getPastMeetingsByYear(year) {
			return this.getPastMeetings().filter((m) => m.TimeStamp.getFullYear() == year);
		}

		hasUpcomingMeetings() {
			return this.getUpcomingMeetings().length > 0;
		}

		hasPastMeetings() {
			return this.getPastMeetings().length > 0;
		}

		getYearsOfPastMeetings() {
			let years = [];
			this.getPastMeetings().forEach((m) => {
				let year = m.TimeStamp.getFullYear();
				if (years.includes(year) == false) {
					years.push(year);
				}
			});
			return years.sort((a, b) => b - a); // Sort descending
		}

		getYearsOfUpcomingMeetings() {
			let years = [];
			this.getUpcomingMeetings().forEach((m) => {
				let year = m.TimeStamp.getFullYear();
				if (years.includes(year) == false) {
					years.push(year);
				}
			});
			return years;
		}

		getTotalDocumentCount() {
			let count = 0;
			this.Meetings.forEach(meeting => {
				count += meeting.Documents.length;
			});
			return count;
		}

		getErrorMessage() {
			// User entered a query containing an invalid syntax such as one consisting only of noise words or words that are too short
			if (this.ErrorCode == "PARAMINVALID") {
				return "The search text was incorrectly formatted, please edit your search text and try again.";
			}
			// User entered a query that took to long to process so the server timed out or the server could not establish, or maintain, a connection to IDOL
			else if (this.ErrorCode == "NETWORK") {
				return "The search took too long to run, please narrow your query or try again later.";
			}
			// None of the above errors apply but we still don't have the criteria for
			// a successful search (ErrorCode is empty) so display a generic server error message instead
			else if (this.ErrorCode && this.ErrorCode.length > 0) {
				return "Error occurred running search, please try again or try again later.";
			}
			return "";
		}

		getWarningMEssage() {
			if (this.WarningCode == "SEARCHLIMITHIT") {
				return "The Search Limit has been reached, please refine your search if desired results are not found.";
			}
			else if (this.WarningCode && this.WarningCode.length > 0) {
				return "Error occurred running search, please try again or try again later.";
			}
			return "";
		}
	}

	class Meeting {
		constructor(data) {
			this.ID = data.ID;
			this.Name = data.Name;
			this.MeetingTypeName = data.MeetingTypeName;
			this.IsAgendaAvailable = data.IsAgendaAvailable;
			this.IsAgendaPacketAvailable = data.IsAgendaPacketAvailable;
			this.IsSummaryAvailable = data.IsSummaryAvailable;
			this.IsMinutesAvailable = data.IsMinutesAvailable;
			this.IsMinutesPacketAvailable = data.IsMinutesPacketAvailable;
			this.Time = data.TimeString;
			this.Date = data.TimeString.split(' ')[0];
			this.TimeStamp = new Date(parseInt(data.TimeStamp) * 1000);
			this.Documents = [];
			this.HasDocuments = data.HasDocuments;
			this.Media = data.Media;
			this.HasMedia = data.HasMedia;
			this.AgendaUniqueName = data.AgendaUniqueName;
			this.AgendaPacketUniqueName = data.AgendaPacketUniqueName;
			this.MinutesPacketUniqueName = data.MinutesPacketUniqueName;
			this.MinutesUniqueName = data.MinutesUniqueName;
			this.SummaryUniqueName = data.SummaryUniqueName;
			this.LatestDocumentType = data.LatestDocumentType;

			if (Array.isArray(data.Documents)) {
				data.Documents.forEach(document => {
					this.Documents.push(new Document(document));
				});
			}
		}
	}

	class Document {
		constructor(data) {
			this.ID = data.ID;
			this.Name = data.Name;
			this.ItemID = data.ItemID;
			this.ItemTitle = data.ItemTitle;
			this.ItemOutlineNum = data.ItemOutlineNum;
			this.PublishType = data.PublishType;
			this.MeetingDocumentType = data.MeetingDocumentType;
			this.UrlFriendlyName = data.UrlFriendlyName;
		}
	}

	function createMeetingTabs(meetingListDiv) {
		if (Options.isUpcomingSeparate) {
			meetingListDiv.append(createSeparateUpcomingMeetingsTab());
		}
		meetingListDiv.append(createAllMeetingsTabs());

		initializeMeetingTabs();
	}

	function createSeparateUpcomingMeetingsTab() {
		if (_searchResults.hasUpcomingMeetings()) {
			let div = $("<div>").append(
				$("<ul>").attr("id", "meetings-upcoming-list-tabs").addClass("nav nav-tabs").append(
					createTab("lnkUpcoming", "#meetings-list-upcoming", Translations.UPCOMING_LABEL)
				)
			);

			let tabContent = $("<div>").attr("id", "meetings-upcoming-list-content").addClass("tab-content");
			let tabPane = $("<div>").attr("id", "meetings-list-upcoming").addClass("tab-pane");

			createMeetingTable(tabPane, _searchResults.getUpcomingMeetings(), true);

			tabContent.append(tabPane);
			div.append(tabContent);

			return div;
		} else {
			return null;
		}
	}

	function createAllMeetingsTabs() {
		let includeRecent = !Options.isUpcomingSeparate && _searchResults.hasUpcomingMeetings();
		let includePast = _searchResults.hasPastMeetings();
		let div = $("<div>");
		div.append(createTabs(includeRecent, includePast));
		div.append(createTabContent(includeRecent, includePast));
		return div;
	}

	function createTabs(includeUpcoming, includePast) {
		let ul = $("<ul>").attr("id", "meetings-list-tabs").addClass("nav nav-tabs");

		if (includeUpcoming) {
			ul.append(createTab("lnkUpcoming", "#meetings-list-upcoming", Translations.UPCOMING_LABEL));
		}
		if (includePast) {
			if (Options.isTabbed) {
				for (let year of _searchResults.getYearsOfPastMeetings()) {
					ul.append(createTab("lnkMeetingYear-" + year, "#meetings-list-" + year, year));
				}
			}
			else {
				ul.append(createTab("lnkRecent", "#meetings-list-recent", Translations.RECENT_LABEL));
			}
		}
		return ul;
	}

	function createTab(id, href, text) {
		return $("<li>").addClass("nav-item").append(
			$("<a>").addClass("nav-link").attr("href", href).attr("data-toggle", "tabs").attr("id", id).text(text)
		);
	}

	function createTabContent(includeUpcoming, includePast) {
		let div = $("<div>").attr("id", "meetings-list-content").addClass("tab-content");

		if (includeUpcoming) {
			let tab = $("<div>").addClass("tab-pane").attr("id", "meetings-list-upcoming");
			createMeetingTable(tab, _searchResults.getUpcomingMeetings(), true)
			div.append(tab);
		}
		if (includePast) {
			if (Options.isTabbed) {
				for (let year of _searchResults.getYearsOfPastMeetings()) {
					let tab = $("<div>").addClass("tab-pane").attr("id", "meetings-list-" + year);
					createMeetingTable(tab, _searchResults.getPastMeetingsByYear(year))
					div.append(tab);
				}
			}
			else {
				let tab = $("<div>").addClass("tab-pane").attr("id", "meetings-list-recent");
				createMeetingTable(tab, _searchResults.getPastMeetings());
				div.append(tab);
			}
		}
		return div;
	}

	function createMeetingTable(parent, meetings, sortAscending = false) {
		parent.append(createCount(meetings));

		let table = $("<table>").addClass("table table-hover");

		if (_runningFullTextSearch)
		{
			table.attr("summary", Translations.TABLE_SUMMARY_FT.format(meetings.length, _searchResults.getTotalDocumentCount()));
		}
		else {
			table.attr("summary", Translations.TABLE_SUMMARY.format(meetings.length));
		}
		table.append($("<colgroup>").append($("<col>").attr("span", "3")).append($("<col>")));

		let header = $("<tr>");

		// The following columns are only visible on medium and large displays
		let meetingNameHeader = $("<th>").attr("scope", "col").addClass("d-none d-md-table-cell").attr("data-sortable-type", "mtgName");
		let meetingNameLink = $("<a>").attr("href", "#").attr("id", "lnkMeetingNameLabel").attr("data-sortable-label", "1")
		meetingNameLink.text(Translations.MEETING_NAME_LABEL);
		meetingNameHeader.append($("<div>").append(meetingNameLink).append(createChevron()));
		header.append(meetingNameHeader);

		let meetingTypeHeader = $("<th>").attr("scope", "col").addClass("d-none d-md-table-cell").attr("data-sortable-type", "mtgType");
		let meetingTypeLink = $("<a>").attr("href", "#").attr("id", "lnkMeetingTypeLabel").attr("data-sortable-label", "1")
		meetingTypeLink.text(Translations.MEETING_TYPE_LABEL);
		meetingTypeHeader.append($("<div>").append(meetingTypeLink).append(createChevron()));
		header.append(meetingTypeHeader);

		let meetingTimeHeader = $("<th>").attr("scope", "col").addClass("d-none d-md-table-cell").attr("data-sortable-type", "mtgTime").attr("data-sortable-numeric", "true").attr("data-sortable-order", sortAscending ? "asc" : "dec");
		let meetingTimeLink = $("<a>").attr("href", "#").attr("id", "lnkMeetingDate").attr("data-sortable-label", "1")
		meetingTimeLink.text(Translations.MEETING_DATE_LABEL);
		meetingTimeHeader.append($("<div>").append(meetingTimeLink).append(createChevron()));
		header.append(meetingTimeHeader);

		// The following column is only visible on small displays
		header.append($("<th>").addClass("d-none d-sm-table-cell d-md-none").text(Translations.MEETING_INFO_LABEL).append(createPadding()));

		// The following column is only visible on extra small displays
		header.append($("<th>").addClass("d-sm-none").text(Translations.MEETING_INFO_LABEL).append(createPadding()));

		// The following column is only visible on small, medium and large displays
		header.append($("<th>").addClass("d-none d-sm-table-cell").text(Translations.LINKS_LABEL).append(createPadding()));

		table.append($("<thead>").append(header));

		let tableBody = $("<tbody>").attr("id", "meetingTableBody");
		addMeetings(tableBody, meetings);

		table.append(tableBody);
		parent.append(table);

		if (_runningFullTextSearch) {
			parent.append(createCount(meetings));
		}
	}

	function createCount(meetings) {
		return $("<span>").addClass("results-count").append(
			$("<span>").addClass("meeting-results-count")
		);
	}

	function createChevron() {
		return $("<span>").addClass("chevron").attr("role", "presentation");
	}

	function addMeetings(parent, meetings) {
		meetings.forEach(meeting => {
			let meetingRow = $("<tr>").attr("id", "meeting-" + meeting.ID + "-row").addClass("meeting-row").attr("data-meeting-id", meeting.ID);

			meetingRow.append($("<td>").addClass("d-none d-md-table-cell").attr("data-sortable-type", "mtgName").text(meeting.Name));
			meetingRow.append($("<td>").addClass("d-none d-md-table-cell").attr("data-sortable-type", "mtgType").text(meeting.MeetingTypeName));
			meetingRow.append($("<td>").addClass("d-none d-md-table-cell").attr("data-sortable-type", "mtgTime").attr("data-sortable-label", meeting.Date)
				.attr("data-sortable-data", meeting.TimeStamp.getTime()).text(meeting.Time));

			// The following cell is only visible on small displays
			meetingRow.append($("<td>").addClass("d-none d-sm-table-cell d-md-none")
				.append(meeting.Name).append($("<br>"))
				.append(meeting.MeetingTypeName).append($("<br>")).append(meeting.Time));

			// The following cell is only visible on extra small displays
			let tdExSmallName = $("<td>").addClass("d-sm-none")
				.append(meeting.Name).append($("<br>"))
				.append(meeting.MeetingTypeName).append($("<br>"))
				.append(meeting.Time).append($("<br>"));
			createMeetingDocumentLinks(tdExSmallName, meeting, "_small");
			tdExSmallName.append(createPadding())
			meetingRow.append(tdExSmallName);

			// The following cell is only visible on small, medium and large displays
			let tdLinks = $("<td>").addClass("d-none d-sm-table-cell");
			createMeetingDocumentLinks(tdLinks, meeting);
			tdLinks.append(createPadding());
			meetingRow.append(tdLinks);

			parent.append(meetingRow);

			if (meeting.HasDocuments) {
				let meetingDocumentRow = $("<tr>").attr("id", "meeting-" + meeting.ID + "-document-row").addClass("meeting-document-row").attr("data-meeting-id", meeting.ID);
				let tdDocuments = $("<td>").attr("colspan", 4);

				meetingDocumentRow.append(tdDocuments);
				parent.append(meetingDocumentRow);

				let lastItemTitle = "";
				let i = 0;
				for (let doc of meeting.Documents) {
					tdDocuments.append($("<div>").addClass("col-lg-1"));
					let documentDiv = $("<div>").addClass("col-lg-11");

					if (doc.ItemTitle != "") {
						// Item Attachment
						if (lastItemTitle != doc.ItemTitle) {
							if (i != 0) {
								documentDiv.append($("<br>"));
							}
							let itemDiv = $("<div>");
							let itemIcon = $("<img>").attr("src", "/OnBaseAgendaOnline/Images/AgendaItem.png").attr("alt", Translations.ITEM_TITLE).addClass("agenda-item");
							itemDiv.append(itemIcon).append(doc.ItemOutlineNum).append(createPadding()).append(doc.ItemTitle);
							documentDiv.append(itemDiv);
						}
						lastItemTitle = doc.ItemTitle;

						let docDiv = $("<div>").append($("<div>").addClass("col-lg-1"));
						let docLinkDiv = $("<div>").addClass("col-lg-11");
						let link = $("<a>")
							.attr("href", "/OnBaseAgendaOnline/Documents/DownloadFile/" + encodeURIComponent(doc.UrlFriendlyName) + ".pdf?documentType=" + doc.MeetingDocumentType + "&meetingId=" + meeting.ID + "&itemId=" + doc.ItemID + "&publishId=" + doc.ID + "&isSection=False" + "&isAttachment=" + (doc.PublishType == 4 ? "True" : "False"))
							.attr("id", "lnkAttachment_" + doc.ItemID + "_" + i)
							.attr("target", "_blank")
							.attr("title", Translations.VIEW_PDF_IN_NEW_TAB_TITLE.format(doc.Name));

						link.append(createPdfIcon());
						link.append(doc.Name);
						docLinkDiv.append(link);

						docDiv.append(docLinkDiv);
						documentDiv.append(docDiv);
					}
					else {
						// Meeting Document
						let docLinkDiv = $("<div>");
						let link = $("<a>")
							.attr("href", "/OnBaseAgendaOnline/Documents/DownloadFile/" + encodeURIComponent(doc.UrlFriendlyName) + ".pdf?documentType=" + doc.MeetingDocumentType + "&meetingId=" + meeting.ID)
							.attr("id", "lnkMeetingDocument_" + meeting.ID + "_" + i).attr("target", "_blank")
							.attr("title", Translations.VIEW_PDF_IN_NEW_TAB_TITLE.format(doc.Name));

						link.append(createPdfIcon());
						link.append(doc.Name);
						docLinkDiv.append(link);

						documentDiv.append(docLinkDiv);
					}

					tdDocuments.append(documentDiv);
					i++;
				};
			}
		});
	}

	function createMeetingDocumentLinks(parent, meeting, linkSize = "") {
		if (meeting.IsAgendaAvailable) {
			parent.append(createMeetingLink(meeting, "Agenda", PublishDocType.Agenda, Translations.AGENDA_TITLE, Translations.AGENDA_LABEL, linkSize));
			parent.append(createMeetingPdfLink(meeting, "Agenda", 1, Translations.AGENDA_LABEL, Translations.VIEW_MEETING_PDF_NEW_TAB_TITLE, linkSize));
		}
		if (meeting.IsAgendaPacketAvailable) {
			parent.append(createPacketLink(meeting, "Agenda", PublishDocType.AgendaPacket, Translations.AGENDA_PACKET_TITLE, Translations.AGENDA_PACKET_LABEL, linkSize));
		}
		if (meeting.IsSummaryAvailable) {
			parent.append(createMeetingLink(meeting, "Summary", PublishDocType.Summary, Translations.SUMMARY_TITLE, Translations.SUMMARY_LABEL, linkSize));
			parent.append(createMeetingPdfLink(meeting, "Summary", 3, Translations.SUMMARY_LABEL, Translations.VIEW_MEETING_PDF_NEW_TAB_TITLE, linkSize));
		}
		if (meeting.IsMinutesAvailable) {
			parent.append(createMeetingLink(meeting, "Minutes", PublishDocType.Minutes, Translations.MINUTES_TITLE, Translations.MINUTES_LABEL, linkSize));
			parent.append(createMeetingPdfLink(meeting, "Minutes", 2, Translations.MINUTES_LABEL, Translations.VIEW_MEETING_PDF_NEW_TAB_TITLE, linkSize));
		}
		if (meeting.IsMinutesPacketAvailable) {
			parent.append(createPacketLink(meeting, "Minutes", PublishDocType.MinutesPacket, Translations.MINUTES_PACKET_TITLE, Translations.MINUTES_PACKET_LABEL, linkSize));
		}
		if (meeting.HasMedia) {
			if (meeting.Media.IsLive) {
				parent.append(
					$("<a>")
						.attr("href", "/OnBaseAgendaOnline/Meetings/ViewMeeting?id=" + meeting.ID + "&doctype=" + meeting.LatestDocumentType)
						.addClass("meetingPadding")
						.attr("Id", "lnkViewMedia_" + meeting.ID + linkSize)
						.attr("title", Translations.MEDIA_TITLE.format(meeting.Name, meeting.MeetingTypeName, meeting.Time))
						.text(Translations.LIVE_MEDIA)
					);
			} else if (meeting.Media.IsOnDemand) {
				parent.append(
					$("<a>")
						.attr("href", "/OnBaseAgendaOnline/Meetings/ViewMeeting?id=" + meeting.ID + "&doctype=" + meeting.LatestDocumentType)
						.addClass("meetingPadding")
						.attr("Id", "lnkViewMedia_" + meeting.ID + linkSize)
						.attr("title", Translations.MEDIA_TITLE.format(meeting.Name, meeting.MeetingTypeName, meeting.Time))
						.text(Translations.VOD_MEDIA)
					);
			}
		}
	}

	function createMeetingLink(meeting, type, docType, titleFormat, text, linkSize) {
		return $("<a>")
			.attr("href", "/OnBaseAgendaOnline/Meetings/ViewMeeting?id=" + meeting.ID + "&doctype=" + docType)
			.attr("id", "lnkMeeting" + type + "_" + meeting.ID + linkSize)
			.attr("title", titleFormat.format(meeting.Name, meeting.MeetingTypeName, meeting.Time))
			.addClass("meeting-link")
			.text(text);
	}

	function createMeetingPdfLink(meeting, type, docType, docName, titleFormat, linkSize) {
		let name = meeting.AgendaUniqueName;
		if (docType == PublishDocType.Summary) {
			name = meeting.SummaryUniqueName
		}
		else if (docType == PublishDocType.Minutes)
		{
			name = meeting.MinutesUniqueName
		}

		return $("<a>")
			.attr("href", "/OnBaseAgendaOnline/Documents/DownloadFile/" + name + ".pdf?documentType=" + docType + "&meetingId=" + meeting.ID)
			.addClass("meetingPadding").attr("id", "lnkMeeting" + type + "Doc_" + meeting.ID + linkSize).attr("target", "_blank")
			.attr("title", titleFormat.format(docName, meeting.Name, meeting.MeetingTypeName, meeting.Time))
			.append(createPdfIcon());
	}

	function createPacketLink(meeting, type, docType, titleFormat, text, linkSize) {
		let name = meeting.AgendaPacketUniqueName;
		if (docType == PublishDocType.MinutesPacket) {
			name = meeting.MinutesPacketUniqueName
		}
		return $("<a>")
			.attr("href", "/OnBaseAgendaOnline/Documents/DownloadFile/" + name + ".pdf?documentType=" + docType + "&meetingId=" + meeting.ID + "&isAttachment=true")
			.addClass("meetingPadding").attr("id", "lnk" + type + "Packet_" + meeting.ID + linkSize).attr("target", "_blank")
			.attr("title", titleFormat.format(meeting.Name, meeting.MeetingTypeName, meeting.Time))
			.append($("<span>").addClass("packet").text(text))
			.append(createPdfIcon());
	}

	function createPdfIcon() {
		return $("<img>")
			.addClass("meetingPadding")
			.attr("src", "/OnBaseAgendaOnline/Images/PDF_16x16.png")
			.attr("alt", Translations.PDF_ICON_TITLE);
	}

	function createPadding() {
		return $("<span>").addClass("meetingPadding");
	}
</script>
