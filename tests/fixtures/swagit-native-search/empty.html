<script>
$(function () {
  $(".video-title").on("keydown", function (e) {
    if (e.key === "Enter" && e.ctrlKey) {
      e.preventDefault();

      let currentRow = $(this).closest("tr");
      let nextRow = currentRow.next();
      let nextNextRow = nextRow.next();

      let containerRows = $();

      if (!nextRow.hasClass("video-row")) {
        containerRows = containerRows.add(nextRow);

        if (nextNextRow.length && !nextNextRow.hasClass("video-row")) {
          containerRows = containerRows.add(nextNextRow);
        }
      }

      let links = containerRows.find("td").find("a, .soundsearch-link");

      if (links.length) {
        links.attr("tabindex", "0");
        links.first().focus();
        manageFocus(links, $(this));

        $(document).off("click.resetTabIndex").on("click.resetTabIndex", function (event) {
          if (!containerRows.has(event.target).length && !$(event.target).is(".video-title")) {
            resetTabIndex(links);
            $(document).off("click.resetTabIndex");
          }
        });
      } else {
        containerRows.focus();
      }
    }

    if (e.key === "Tab" && e.shiftKey) {
      e.preventDefault();  
      let prevVideoTitle = $(this).closest("tr").prevAll(".video-row").first().find(".video-title");
      if (prevVideoTitle.length) {
        prevVideoTitle.focus();
      }
    }
  });

  function manageFocus(links, previousVideoTitle) {
    links.first().on("keydown", function (e) {
      if (e.key === "Tab" && e.shiftKey) {
        e.preventDefault();
        resetTabIndex(links);
        previousVideoTitle.focus();
      }
    });

    links.last().on("keydown", function (e) {
      if (e.key === "Tab" && !e.shiftKey) {
        e.preventDefault();
        resetTabIndex(links);
        let nextVideoTitle = previousVideoTitle.closest("tr").nextAll(".video-row").first().find(".video-title");
        if (nextVideoTitle.length) {
          nextVideoTitle.focus();
        }
      }
    });
  }

  function resetTabIndex(links) {
    links.attr("tabindex", "-1");
    console.log(links)
  }
});
</script>
