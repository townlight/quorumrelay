[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "quorumrelay"
version = "0.1.0.dev5"
description = "Independent, bounded civic meeting data connectors"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11,<0.12"]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
service = ["mcp==2.3.0", "starlette>=0.52.1,<1", "uvicorn>=0.54,<1", "python-multipart>=0.0.33,<1", "jsonschema>=4.26,<5"]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
quorumrelay = "quorumrelay.cli:main"
civic-data-connectors = "civic_data_connectors.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civic_data_connectors", "src/quorumrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
